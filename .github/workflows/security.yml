name: Security

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            ai_cli_runner_manager/requirements.lock
            ai_cli_runner_manager/provider-requirements.lock
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install pip-audit and patch base packaging tools
        # setuptools is not in requirements-dev.lock (pip bootstrap), but
        # GitHub-hosted runners may ship a vulnerable setuptools that
        # pip-audit --local will flag (e.g. PYSEC-2026-3447 / 79.x).
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0" "wheel"
          python -m pip install pip-audit
      - name: Audit installed environment
        # Prefer --local after a hashed install. Auditing the lock file with
        # --require-hashes dry-run can fail on incomplete transitive extras.
        # Base image tooling (setuptools/wheel) is patched in the previous step.
        run: python -m pip_audit --local --progress-spinner=off
      - name: Audit isolated AI CLI dependency planes
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/security
          for plane in manager provider; do
            lock="ai_cli_runner_manager/requirements.lock"
            if [ "$plane" = "provider" ]; then
              lock="ai_cli_runner_manager/provider-requirements.lock"
            fi
            python -m venv ".audit-$plane"
            ".audit-$plane/bin/python" -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0" wheel pip-audit
            ".audit-$plane/bin/python" -m pip install --require-hashes --requirement "$lock"
            ".audit-$plane/bin/python" -m pip_audit --local --progress-spinner=off \
              --format json --output ".ci-artifacts/security/pip-audit-ai-cli-$plane.json"
            ".audit-$plane/bin/python" -m pip freeze > ".ci-artifacts/security/pip-freeze-ai-cli-$plane.txt"
          done
      - name: Record audit evidence
        if: always()
        run: |
          mkdir -p .ci-artifacts/security
          python -m pip_audit --local --progress-spinner=off -f json -o .ci-artifacts/security/pip-audit.json || true
          python -m pip freeze > .ci-artifacts/security/pip-freeze.txt
      - name: Upload python security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-evidence-${{ github.sha }}
          path: .ci-artifacts/security
          if-no-files-found: warn
          retention-days: 14

  npm-deps:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependency graph
        run: npm ci
      - name: Test npm audit policy
        run: node --test scripts/check-npm-audit.test.mjs
      - name: npm audit (high+ with reviewed non-applicable exception)
        run: node scripts/check-npm-audit.mjs
      - name: Save npm audit JSON
        if: always()
        run: |
          mkdir -p ../.ci-artifacts/security
          npm audit --json > ../.ci-artifacts/security/npm-audit.json || true
      - name: Upload npm security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-security-evidence-${{ github.sha }}
          path: .ci-artifacts/security
          if-no-files-found: warn
          retention-days: 14

  pilot-observability-images:
    name: Pilot image audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: otel-collector
            ref: otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
          - name: prometheus
            ref: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
          - name: alertmanager
            ref: quay.io/prometheus/alertmanager:main@sha256:a42c3e2e8f7cd4fd3a0ce1bd593ca5abe965c97b993476007d6f69c4a2aa33b5
          - name: grafana
            ref: grafana/grafana:nightly-distroless-slim@sha256:b2c2fd5391216bd57e6bad74c0dce05f8e275479e1153ab57149a4f019a3dceb
          - name: tempo
            ref: grafana/tempo:main-1a8b052-2010-1@sha256:78dc87894e9eb054b0229980ac3e7f099b437aec07a8731612373fc09b7f8ba0
          - name: loki
            ref: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan immutable image with uncompromised pilot policy
        env:
          IMAGE_REF: ${{ matrix.ref }}
          REPORT_PATH: .ci-artifacts/security/trivy-observability-${{ matrix.name }}.json
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/security
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            aquasec/trivy:0.73.0@sha256:4bbf3824d974b70f27631005e2e6194d4d8fbd6e72c4a9e04cf521e25c5cb07f \
            image \
            --image-src remote \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output "/work/$REPORT_PATH" \
            "$IMAGE_REF"
      - name: Upload pilot image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-image-security-${{ matrix.name }}-${{ github.sha }}
          path: .ci-artifacts/security/trivy-observability-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14

  sbom-provenance:
    name: SBOM, checksums, provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # OIDC + attestations required for GitHub-signed provenance (Sigstore).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
      - name: Generate CycloneDX SBOMs
        env:
          # Optional comma-separated image refs for Syft/Trivy layer SBOMs (release jobs).
          IMAGE_SBOM_REFS: ${{ vars.IMAGE_SBOM_REFS }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${IMAGE_SBOM_REFS:-}" ]; then
            IFS=',' read -r -a refs <<< "${IMAGE_SBOM_REFS}"
            for ref in "${refs[@]}"; do
              ref="$(echo "$ref" | xargs)"
              [ -n "$ref" ] && extra+=(--image "$ref")
            done
          fi
          python scripts/generate_sbom.py --output-dir .ci-artifacts/sbom "${extra[@]}"
      - name: Generate SHA-256 checksums
        run: >
          python scripts/generate_release_checksums.py
          --input-dir .ci-artifacts/sbom
          --output .ci-artifacts/checksums/SHA256SUMS.txt
      - name: Generate provenance statement (pre-attestation)
        run: >
          python scripts/generate_provenance.py
          --artifacts-dir .ci-artifacts/sbom
          --checksums .ci-artifacts/checksums
          --output .ci-artifacts/provenance/provenance.intoto.json
          --invocation-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --builder-id "https://github.com/${{ github.repository }}/actions/security.yml@${{ github.sha }}"
          --signature-status github_attestation_pending
      - name: Verify SBOM files are non-empty
        run: |
          set -euo pipefail
          test -s .ci-artifacts/sbom/sbom-backend.cdx.json
          test -s .ci-artifacts/sbom/sbom-frontend.cdx.json
          test -s .ci-artifacts/sbom/sbom-ai-cli-manager.cdx.json
          test -s .ci-artifacts/sbom/sbom-ai-cli-provider.cdx.json
          test -s .ci-artifacts/sbom/sbom-containers.cdx.json
          test -s .ci-artifacts/checksums/SHA256SUMS.txt
          test -s .ci-artifacts/provenance/provenance.intoto.json
          python - <<'PY'
          import json
          from pathlib import Path
          backend = json.loads(Path(".ci-artifacts/sbom/sbom-backend.cdx.json").read_text(encoding="utf-8"))
          frontend = json.loads(Path(".ci-artifacts/sbom/sbom-frontend.cdx.json").read_text(encoding="utf-8"))
          manager = json.loads(Path(".ci-artifacts/sbom/sbom-ai-cli-manager.cdx.json").read_text(encoding="utf-8"))
          provider = json.loads(Path(".ci-artifacts/sbom/sbom-ai-cli-provider.cdx.json").read_text(encoding="utf-8"))
          assert backend.get("bomFormat") == "CycloneDX"
          assert frontend.get("bomFormat") == "CycloneDX"
          assert manager.get("bomFormat") == "CycloneDX"
          assert provider.get("bomFormat") == "CycloneDX"
          assert len(backend.get("components") or []) >= 1
          assert len(frontend.get("components") or []) >= 1
          assert len(manager.get("components") or []) >= 1
          assert len(provider.get("components") or []) >= 1
          print("SBOM component counts:", len(backend["components"]), len(frontend["components"]), len(manager["components"]), len(provider["components"]))
          PY
      - name: Sign subjects with GitHub artifact attestation
        id: attest
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            .ci-artifacts/sbom/sbom-backend.cdx.json
            .ci-artifacts/sbom/sbom-frontend.cdx.json
            .ci-artifacts/sbom/sbom-ai-cli-manager.cdx.json
            .ci-artifacts/sbom/sbom-ai-cli-provider.cdx.json
            .ci-artifacts/sbom/sbom-containers.cdx.json
            .ci-artifacts/checksums/SHA256SUMS.txt
            .ci-artifacts/checksums/SHA256SUMS.json
            .ci-artifacts/provenance/provenance.intoto.json
      - name: Record GitHub attestation metadata (sidecar only)
        if: success()
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # Do not rewrite provenance.intoto.json after attestation — digests would break.
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path

          out = Path(".ci-artifacts/provenance/github-attestation.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "schema_version": 1,
              "signature_status": "github_attestation",
              "recorded_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "attestation": {
                  "id": os.environ.get("ATTESTATION_ID") or None,
                  "url": os.environ.get("ATTESTATION_URL") or None,
                  "bundle_path": os.environ.get("BUNDLE_PATH") or None,
              },
              "subjects_attested": [
                  ".ci-artifacts/sbom/sbom-backend.cdx.json",
                  ".ci-artifacts/sbom/sbom-frontend.cdx.json",
                  ".ci-artifacts/sbom/sbom-ai-cli-manager.cdx.json",
                  ".ci-artifacts/sbom/sbom-ai-cli-provider.cdx.json",
                  ".ci-artifacts/sbom/sbom-containers.cdx.json",
                  ".ci-artifacts/checksums/SHA256SUMS.txt",
                  ".ci-artifacts/checksums/SHA256SUMS.json",
                  ".ci-artifacts/provenance/provenance.intoto.json",
              ],
              "verify": "gh attestation verify <artifact> --repo ${{ github.repository }}",
              "notes": (
                  "GitHub Actions signed the listed subjects via Sigstore. "
                  "The in-toto statement remains the inventory; the signature is the GitHub attestation."
              ),
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out)
          PY
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: |
            .ci-artifacts/sbom
            .ci-artifacts/checksums
            .ci-artifacts/provenance
          if-no-files-found: warn
          retention-days: 14

  secrets-and-mutation-tests:
    name: Secrets-never and security unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run security-focused unit tests
        run: >
          python -m pytest
          tests/test_security_secrets_never.py
          tests/test_security_mutation_matrix.py
          tests/test_egress_redaction.py
          --junitxml=.ci-artifacts/security/security-junit.xml
      - name: Upload security test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-tests-evidence-${{ github.sha }}
          path: .ci-artifacts/security
          if-no-files-found: warn
          retention-days: 14
