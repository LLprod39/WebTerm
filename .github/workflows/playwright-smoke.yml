name: Playwright Smoke

on:
  # Always run on protected-branch PRs/pushes so the required F-11 check context
  # is never missing because of path filters.
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: frontend-qa-ci-only
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: frontend-qa-ci-only
      POSTGRES_DB: postgres
      WEBTERM_BACKEND_URL: http://127.0.0.1:9001
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install native backend dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r ../requirements-dev.lock

      - name: Prepare isolated PostgreSQL and SSH fixture
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/frontend/tests/backend"
          python tests/backend/prepare.py
          python tests/backend/ssh_fixture.py > /tmp/webterm-qa-ssh.log 2>&1 &
          DJANGO_SETTINGS_MODULE=qa_settings python -m daphne -b 127.0.0.1 -p 9001 web_ui.asgi:application > /tmp/webterm-qa-api.log 2>&1 &
          npm run dev -- --port 8091 > /tmp/webterm-qa-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8091/api/auth/csrf/ -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8091/api/auth/csrf/ -o /dev/null

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-backend workflow, permission and WCAG smoke tests
        run: npm run test:e2e:smoke

      - name: Enforce production bundle budget
        run: npm run build:budget

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-evidence-${{ github.sha }}
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/artifacts/bundle-budget.json
            frontend/artifacts/interaction-budget.json
          if-no-files-found: warn
          retention-days: 14
