name: Architecture Fitness

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-fitness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-no-regression:
    name: Architecture No Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Reject new or grown architecture debt
        run: python scripts/check_architecture_no_regression.py
      - name: Upload no-regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-no-regression-${{ github.sha }}
          path: .ci-artifacts/architecture-no-regression.json
          if-no-files-found: error
          retention-days: 14

  architecture-fitness:
    name: God-file & Import Boundary Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify runtime contract
        run: python scripts/verify_runtime_contract.py

      - name: Check complexity, coupling, size signals + import boundaries
        # Line count is diagnostic. Complexity/fan-in/fan-out and import
        # boundaries are the blocking architecture signals.
        run: python scripts/check_architecture_sizes.py --strict-new
