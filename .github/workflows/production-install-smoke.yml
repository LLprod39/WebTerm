name: Production Install Smoke

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-linux-install:
    name: Clean Linux Install and Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run production install, readiness and worker smoke
        env:
          F13A_KEEP_UP: "1"
        run: ./docker/production-install-smoke.sh
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run the production operator golden path
        working-directory: frontend
        env:
          WEBTERM_RELEASE_BASE_URL: https://127.0.0.1:18443
          WEBTERM_RELEASE_ADMIN_USERNAME: f13a-admin
          WEBTERM_RELEASE_ADMIN_PASSWORD: F13aSmokePass123!
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/release-published.spec.ts --config playwright.release.config.ts
      - name: Upload F-13a evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f13a-production-install-${{ github.sha }}
          path: |
            .ci-artifacts/production-install-smoke
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 14
