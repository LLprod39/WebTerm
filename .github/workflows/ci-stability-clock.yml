name: CI Stability Clock

on:
  schedule:
    # Daily audit of the F-11 protected green-SHA evidence gate (does not mutate branch protection).
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [test, main]
    paths:
      - "config/github-governance.json"
      - "config/ci-stability-ledger.json"
      - "scripts/github_governance.py"
      - "scripts/ci_stability_clock.py"
      - ".github/workflows/ci-stability-clock.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-stability-clock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clock-status:
    name: F-11 Clock Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Install pytest
        # Clock/governance tests import only stdlib helpers from scripts/, so the
        # full dev lock is unnecessary here. Pin matches requirements-dev.lock.
        run: python -m pip install pytest==9.1.1

      - name: Evaluate local clock ledger
        run: python scripts/ci_stability_clock.py

      - name: Unit tests for clock and governance policy
        run: python -m pytest tests/test_ci_stability_clock.py tests/test_github_governance_policy.py -q

      - name: Sync unique green SHAs from GitHub (read-only ledger write is local only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Audit-only by default on schedule/push: dry-run sync reports candidates.
          # Ledger commits are intentional human/release steps after clock start.
          python scripts/github_governance.py --sync-unique-shas --dry-run || true
          python scripts/github_governance.py --clock-status
