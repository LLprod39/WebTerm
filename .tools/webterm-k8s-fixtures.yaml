apiVersion: v1
kind: Namespace
metadata:
  name: webterm-stage
  labels:
    environment: stage
    owner: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: webterm-prod
  labels:
    environment: prod
    owner: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: webterm-stage
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/managed-by: rancher
    owner: platform
    environment: stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/managed-by: rancher
        owner: platform
        environment: stage
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: webterm-stage
  labels:
    app.kubernetes.io/name: demo-api
spec:
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-api
  namespace: webterm-stage
spec:
  ingressClassName: nginx
  rules:
    - host: demo.webterm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-api
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: webterm-prod
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/managed-by: devtron
    owner: payments
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/managed-by: devtron
        owner: payments
        environment: prod
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: webterm-prod
  labels:
    app.kubernetes.io/name: payments-api
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api
  namespace: webterm-prod
spec:
  ingressClassName: nginx
  rules:
    - host: payments.webterm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-worker
  namespace: webterm-prod
  labels:
    app.kubernetes.io/name: broken-worker
    app.kubernetes.io/managed-by: rancher
    owner: payments
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: broken-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broken-worker
        app.kubernetes.io/managed-by: rancher
        owner: payments
        environment: prod
    spec:
      containers:
        - name: broken
          image: registry.invalid/webterm/broken-worker:missing
          imagePullPolicy: Always
