# Локальный стек Studio: PostgreSQL + MCP сервисы.
# Запуск:
#   docker compose -f docker-compose.postgres-mcp.yml up -d
# Остановка:
#   docker compose -f docker-compose.postgres-mcp.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weu_platform}
      POSTGRES_USER: ${POSTGRES_USER:-weu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weu_secret_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mini_prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weu} -d ${POSTGRES_DB:-weu_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"

  redis:
    image: redis:7-alpine
    container_name: mini-prod-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-demo:
    image: python:3.12-slim
    container_name: mini-prod-mcp-demo
    working_dir: /workspace
    command: ["python", "studio/demo_mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${STUDIO_MCP_DEMO_PORT:-8765}:8765"
    volumes:
      - .:/workspace
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-runner:
    build:
      context: .
      dockerfile: docker/mcp-runner.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    container_name: mini-prod-mcp-runner
    environment:
      MCP_RUNNER_TOKEN: ${STUDIO_MCP_RUNNER_TOKEN:-}
      MCP_RUNNER_SESSION_TTL_SECONDS: ${MCP_RUNNER_SESSION_TTL_SECONDS:-300}
      MCP_RUNNER_MAX_SESSIONS: ${MCP_RUNNER_MAX_SESSIONS:-50}
    # Published to loopback so a host-run backend can reach it at
    # STUDIO_MCP_RUNNER_URL=http://127.0.0.1:9100
    ports:
      - "${MCP_RUNNER_PORT:-9100}:9000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mini_prod_postgres_data:
