[project]
name = "weu-ai-platform"
version = "2.0.0"
description = "WEU AI Agent Platform - DevOps/IT task automation"
requires-python = ">=3.11,<3.13"
license = { text = "Apache License 2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    ".venv-wsl",
    "venv",
    "__pycache__",
    "migrations",
    "node_modules",
    ".eggs",
    "*.egg",
    "graphify-out",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (временно)
    "E722",   # bare except (временно, будем исправлять постепенно)
    "B904",   # raise without from (временно)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "core_ui", "kubernetes_ops", "plugin_marketplace", "servers", "studio", "web_ui"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web_ui.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["tests", "app", "core_ui", "servers"]

[tool.coverage.run]
source = ["app", "core_ui", "servers"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# Backend coverage ratchet (F-06). Frozen baseline measured in the locked
# runtime (Python 3.11.15 / Django 5.2.16) over the CI backend-unit cov set
# (app, core_ui, servers, studio, kubernetes_ops, plugin_marketplace, mars,
# web_ui): 71.95% on 2026-07-23 (54364/75557 lines, 2181 passed / 3 skipped).
# ``fail_under`` sits just below that baseline so CI fails on any real
# regression; raise it as coverage improves. Stage 1 exit target is >=80%.
precision = 2
fail_under = 71.5
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Architecture fitness checks — enforced by scripts/check_architecture_sizes.py
# and lint-imports.  See docs/local/ARCHITECTURE_CONTRACT.md for the full rule set.
[tool.architecture]
standard_limit = 500
strict_limit = 1000
enforce_import_boundaries = true
strict_new_files = true
contract_file = "docs/local/ARCHITECTURE_CONTRACT.md"

# import-linter configuration (used by pre-commit / CI via lint-imports).
# The contracts themselves live in .importlinter at the project root.
[tool.importlinter]
config_filename = ".importlinter"

# Legacy baseline pins: files listed here existed before the size limit was
# introduced.  They are allowed to remain at their current size but must NOT
# grow.  Remove a file from this list once it has been refactored under the
# standard limit.
