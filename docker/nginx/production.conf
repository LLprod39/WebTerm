map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;
client_max_body_size 2m;

server {
    listen 8080;
    server_name _;

    underscores_in_headers on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never trust identity headers supplied by the client. Deployments that use
    # domain SSO must set these from a trusted auth_request/auth proxy layer.
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header REMOTE_USER "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Legacy playbook archives may still exist under MEDIA_ROOT during an
    # upgrade. They are private source artifacts and must never bypass the API.
    location = /media/playbook_bundles {
        return 404;
    }

    location ^~ /media/playbook_bundles/ {
        return 404;
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 5m;
        add_header Cache-Control "private, max-age=300";
    }

    location /api/ {
        proxy_pass http://backend:9000;
    }

    location = /api/plugins/packages/install-local-upload/ {
        client_max_body_size 12m;
        proxy_pass http://backend:9000;
    }

    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:9000;
    }

    location ~ ^/api/studio/triggers/[^/]+/receive/$ {
        limit_req zone=webhook_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:9000;
    }

    location /servers/api/ {
        proxy_pass http://backend:9000;
    }

    location = /servers/api/playbooks/import/preview/ {
        client_max_body_size 12m;
        proxy_pass http://backend:9000;
    }

    location = /servers/api/playbooks/import/commit/ {
        client_max_body_size 12m;
        proxy_pass http://backend:9000;
    }

    location ~ ^/servers/api/[0-9]+/files/upload/$ {
        client_max_body_size 52m;
        proxy_pass http://backend:9000;
    }

    location ^~ /admin/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:9000;
    }

    location = /login {
        proxy_pass http://frontend:8080;
    }

    location = /login/ {
        proxy_pass http://backend:9000;
    }

    location = /logout/ {
        proxy_pass http://backend:9000;
    }

    location /ws/ {
        proxy_pass http://backend:9000;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}

server {
