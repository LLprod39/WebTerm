map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    underscores_in_headers on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never trust identity headers supplied by the client. Deployments that use
    # domain SSO must set these from a trusted auth_request/auth proxy layer.
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header REMOTE_USER "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:9000;
    }

    location /servers/api/ {
        proxy_pass http://backend:9000;
    }

    location ^~ /admin/ {
        proxy_pass http://backend:9000;
    }

    location = /login/ {
        proxy_pass http://backend:9000;
    }

    location = /logout/ {
        proxy_pass http://backend:9000;
    }

    location = /media/playbook_bundles {
        return 404;
    }

    location ^~ /media/playbook_bundles/ {
        return 404;
    }

    location ^~ /media/ {
        proxy_pass http://backend:9000;
    }

    location ^~ /static/ {
        proxy_pass http://backend:9000;
    }

    location /ws/ {
        proxy_pass http://backend:9000;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
