http_port 3128
visible_hostname webterm-ai-cli-egress

acl SSL_ports port 443
acl CONNECT method CONNECT
acl localhost src 127.0.0.0/8 ::1/128
acl manager proto cache_object
acl provider_domains dstdomain .openai.com .chatgpt.com .oaistatic.com .oaiusercontent.com .x.ai .grok.com
# Block loopback, link-local/metadata, RFC1918, carrier-grade NAT, multicast,
# documentation and otherwise non-public ranges before evaluating hostnames.
# This also makes DNS rebinding to a private address fail closed.
acl forbidden_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl forbidden_dst dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl forbidden_dst dst 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl forbidden_dst dst 224.0.0.0/4 240.0.0.0/4
acl forbidden_dst dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access allow localhost manager
http_access deny manager
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access deny forbidden_dst
http_access allow CONNECT provider_domains SSL_ports
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
coredump_dir /tmp
