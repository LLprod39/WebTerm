meta:
  title: "WebTerm master QA plan"
  version: "2.0"
  last_updated: "2026-05-27"
  objective: "Current release and regression plan for backend API, WebSocket flows, Studio pipelines, frontend UI, and operational integrations."
  source_of_truth:
    - "README.md"
    - "pyproject.toml"
    - "frontend/package.json"
    - "web_ui/settings/base.py"
    - "web_ui/settings/test.py"
    - "web_ui/urls.py"
    - "web_ui/routing.py"
    - "core_ui/urls.py"
    - "servers/urls.py"
    - "servers/routing.py"
    - "studio/urls.py"
    - "studio/routing.py"
    - "studio/pipeline_validation.py"
    - "frontend/src/App.tsx"
    - "frontend/src/api/"

automation_commands:
  backend_full:
    cwd: "C:\\WebTrerm"
    command: "python -m pytest"
    notes:
      - "Uses DJANGO_SETTINGS_MODULE=web_ui.settings.test from pyproject.toml."
      - "Test settings force SQLite, locmem email, eager Celery, and InMemoryChannelLayer."
  backend_targeted_smoke:
    cwd: "C:\\WebTrerm"
    command: "python -m pytest tests/test_core_ui_api_smoke.py tests/test_servers_api_smoke.py tests/test_studio_api_smoke.py"
  architecture:
    cwd: "C:\\WebTrerm"
    command: "python scripts/check_architecture_sizes.py --strict-new"
    notes:
      - "Also runs import-linter when available because enforce_import_boundaries=true."
  frontend_install:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm ci"
  frontend_unit:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm run test"
  frontend_build:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm run build"
  playwright_smoke:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm run test:e2e:smoke"
  playwright_a11y:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm run test:e2e:a11y"
  playwright_visual:
    cwd: "C:\\WebTrerm\\frontend"
    command: "npm run test:e2e:visual"

release_gate:
  required_for_pr:
    - "Run relevant backend pytest modules for touched domains."
    - "Run frontend unit/build checks for touched frontend files."
    - "Run architecture check when adding or growing Python/TS/TSX files."
    - "Run Playwright smoke for changes in auth, navigation, servers, terminal, settings, Studio, or shared layout."
  required_for_release:
    - "Backend full suite passes or failures are triaged with owner/date."
    - "Frontend build passes."
    - "Playwright smoke passes against the intended deployment shape."
    - "Manual live checks are completed for integrations that cannot be safely mocked."
    - "No blocker/critical defects are open for the release scope."

