test_suites:
  - suite: "Auth, sessions, access, and admin"
    priority: "smoke"
    surfaces: ["API", "UI"]
    automated:
      - "Login, session, ws-token, logout."
      - "Feature permissions and access APIs."
      - "Admin dashboard/activity/session endpoints."
    manual:
      - "Domain SSO through a real trusted reverse proxy."
      - "Cross-site cookie/CSRF behavior when frontend and backend use different origins."

  - suite: "Servers inventory and terminal"
    priority: "smoke"
    surfaces: ["API", "WebSocket", "UI"]
    automated:
      - "Server CRUD/detail/update/delete and groups/shares."
      - "Terminal ticket and SSH lifecycle service units."
      - "Command history, terminal events, terminal input parsing, snapshots."
      - "OS detection and read-only server AI policy."
    manual:
      - "Real SSH session against a sandbox server."
      - "Real SSH interaction."
      - "SFTP upload/download/edit/delete against a sandbox path."

  - suite: "Linux UI workspace"
    priority: "regression"
    surfaces: ["API", "UI"]
    automated:
      - "Capabilities, overview, services/processes/docker/logs/disk/network/packages endpoints where mocked."
      - "Frontend smoke for workspace navigation and key windows."
    manual:
      - "Service start/stop/restart with an expendable test service."
      - "Process kill and Docker action guardrails in a sandbox."

  - suite: "Monitoring, alerts, and watchers"
    priority: "regression"
    surfaces: ["API", "worker", "Studio trigger"]
    automated:
      - "Monitoring dashboard/status/refresh."
      - "Health check serialization and alert query snapshots."
      - "Monitoring-triggered Studio pipeline dispatch."
    manual:
      - "Long-running monitor process via `python manage.py run_monitor`."
      - "Alert lifecycle against real degraded host/container signals."

  - suite: "Studio pipelines"
    priority: "smoke"
    surfaces: ["API", "UI", "WebSocket", "worker"]
    automated:
      - "Pipeline CRUD, clone, manual run, run list/detail/stop/approve."
      - "Graph validation for node types, branch handles, triggers, cycles, and unreachable nodes."
      - "All-node smoke and migrated node executor tests."
      - "Pipeline live WebSocket updates."
    manual:
      - "Webhook trigger with real external caller."
      - "Scheduled trigger through `python manage.py run_scheduled_pipelines`."
      - "Human approval email/Telegram delivery with sandbox credentials."

  - suite: "Studio MCP, skills, agents, notifications"
    priority: "regression"
    surfaces: ["API", "integration", "filesystem"]
    automated:
      - "MCP CRUD/test/tools/templates with mocked transports."
      - "Skill catalog/detail/scaffold/validate/workspace APIs."
      - "Agent config CRUD and policy enforcement."
      - "Notification settings save/test endpoints with mocked transports."
    manual:
      - "Real stdio/SSE MCP server handshake."
      - "Real Telegram and SMTP delivery."
      - "Skill workspace editing with representative local skill packs."

  - suite: "Agent runtime, memory, and safety"
    priority: "regression"
    surfaces: ["unit", "API", "worker"]
    automated:
      - "Command safety and dry-run execution policy."
      - "Memory redaction, repair, extraction, planning, and reporter units."
      - "Runtime limit checks for agent and pipeline dispatch."
      - "Egress redaction and editor intercept services."
    manual:
      - "Review generated AI reports for secret leakage before external demos."
      - "Run memory dreams only on non-production test data unless explicitly approved."

  - suite: "Frontend shell and pages"
    priority: "smoke"
    surfaces: ["UI"]
    automated:
      - "SPA navigation, auth, servers, terminal, agents, Studio, settings."
      - "A11y smoke and visual snapshots."
      - "Component tests for pipeline graph helpers and key pages."
    manual:
      - "Responsive smoke at desktop, tablet, and mobile widths."
      - "Keyboard/focus pass on dialogs, node side panel, server picker, settings tables."

  - suite: "Deployment and production contracts"
    priority: "release"
    surfaces: ["config", "Docker", "ops"]
    automated:
      - "Production settings fail fast when `DJANGO_DEBUG=false` but required env is missing."
      - "Docker build and smoke compose when touched."
    manual:
      - "PostgreSQL + Redis deployment smoke."
      - "Nginx/static/media routing check."
      - "Render deployment variables and startup script verification."

known_gaps:
  - "Live SSH is intentionally manual or sandbox-only."
  - "External SMTP, Telegram, and MCP delivery need live sandbox validation before release."
  - "Architecture check depends on import-linter being installed in the current Python environment."
  - "Playwright visual snapshots must be updated intentionally, never as incidental churn."

artifact_policy:
  canonical_plan: "docs/qa/qa_master_plan.yaml"
  keep_in_git:
    - "Test source files"
    - "Playwright visual snapshots when intentionally updated"
    - "CI config and versioned fixtures"
  keep_out_of_git:
    - "frontend/playwright-report/"
    - "frontend/test-results/"
    - "runtime logs"
    - "local databases"
    - "manual screenshots unless they are curated documentation assets"
