# .pre-commit-config.yaml
# Enforces the architecture fitness checks defined in docs/architecture/ARCHITECTURE_CONTRACT.md.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually on all files:
#   pre-commit run --all-files
#
# The two local hooks below match the CI checks in
# .github/workflows/architecture-fitness.yml exactly.

repos:
  - repo: local
    hooks:
      - id: architecture-sizes
        name: Architecture god-file prevention
        language: system
        entry: python scripts/check_architecture_sizes.py --strict-new
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: Import boundary contracts
        language: system
        entry: lint-imports --no-cache
        pass_filenames: false
        always_run: true

      - id: runtime-contract
        name: Frozen runtime contract
        language: system
        entry: python scripts/verify_runtime_contract.py
        pass_filenames: false
        always_run: true

      - id: docs-contract
        name: Authoritative documentation contract
        language: system
        entry: python scripts/verify_docs_contract.py
        pass_filenames: false
        always_run: true
