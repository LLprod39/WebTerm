# Минимальный dev-стек mini_prod.
# Запуск: docker compose up -d --build
# Остановка: docker compose down
#
# POSTGRES_PORT в .env — это host-port для доступа с Windows/WSL.
# Внутри docker-сети backend и workers всегда ходят в postgres:5432.

x-backend-worker: &backend-worker
  image: webtrerm-backend-dev:latest
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    args:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
  working_dir: /workspace
  environment:
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    ftp_proxy: ${ftp_proxy:-}
    no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,ai-cli-runner-manager}
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    FTP_PROXY: ${FTP_PROXY:-}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,ai-cli-runner-manager}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-weu_platform}
    POSTGRES_USER: ${POSTGRES_USER:-weu}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weu_secret_change_me}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-this-secret-before-public-deploy-2026-03-12}
    # Managed secrets (пароли серверов, k8s-токены) шифруются ключом из MANAGED_SECRET_KEY
    # (fallback: SECRET_KEY). Дефолт ниже повторяет dev-fallback Django SECRET_KEY, чтобы
    # workers в контейнерах расшифровывали секреты, сохранённые локальным dev-бэкендом
    # (runserver без DJANGO_SECRET_KEY). Все процессы обязаны использовать один ключ.
    MANAGED_SECRET_KEY: ${MANAGED_SECRET_KEY:-${DJANGO_SECRET_KEY:-django-insecure-@b9idj_4skbcph+21q6^bc0qbs*$$qs&@7r2sqfn*1#)z5_i%my}}
    CHANNEL_REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    SITE_URL: ${SITE_URL:-http://127.0.0.1:8080}
    FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://127.0.0.1:8080}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    DJANGO_PORT: 9000
    PORT: 9000
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-web_ui.settings.production}
    MARS_AGENT_RUNTIME: ${MARS_AGENT_RUNTIME:-docker}
    MARS_AGENT_DOCKER_IMAGE: ${MARS_AGENT_DOCKER_IMAGE:-webterm-mars-agent:latest}
    MARS_AGENT_DOCKER_NETWORK: ${MARS_AGENT_DOCKER_NETWORK:-bridge}
    MARS_AGENT_DOCKER_CPUS: ${MARS_AGENT_DOCKER_CPUS:-2}
    MARS_AGENT_DOCKER_MEMORY: ${MARS_AGENT_DOCKER_MEMORY:-2g}
    MARS_AGENT_DOCKER_CODEX_HOME_VOLUME: ${MARS_AGENT_DOCKER_CODEX_HOME_VOLUME:-mini-prod-mars-codex-home}
    MARS_AGENT_DOCKER_GEMINI_HOME_VOLUME: ${MARS_AGENT_DOCKER_GEMINI_HOME_VOLUME:-mini-prod-mars-gemini-home}
    MARS_CODEX_HOME: ${MARS_CODEX_HOME:-/mars-codex-home}
    MARS_GEMINI_HOME: ${MARS_GEMINI_HOME:-/mars-gemini-home}
    MARS_DOCKER_CONTAINER_PATH_PREFIX: ${MARS_DOCKER_CONTAINER_PATH_PREFIX:-/workspace}
    MARS_DOCKER_HOST_PATH_PREFIX: ${MARS_DOCKER_HOST_PATH_PREFIX:-}
    AGENT_COMMAND_RUNTIME: ${AGENT_COMMAND_RUNTIME:-docker}
    AGENT_COMMAND_RUNNER_IMAGE: ${AGENT_COMMAND_RUNNER_IMAGE:-}
    AGENT_COMMAND_DOCKER_NETWORK: ${AGENT_COMMAND_DOCKER_NETWORK:-bridge}
    AGENT_COMMAND_DOCKER_CPUS: ${AGENT_COMMAND_DOCKER_CPUS:-0.5}
    AGENT_COMMAND_DOCKER_MEMORY: ${AGENT_COMMAND_DOCKER_MEMORY:-256m}
    AGENT_COMMAND_DOCKER_PIDS_LIMIT: ${AGENT_COMMAND_DOCKER_PIDS_LIMIT:-64}
    AGENT_COMMAND_TIMEOUT_SECONDS: ${AGENT_COMMAND_TIMEOUT_SECONDS:-120}
    AGENT_COMMAND_OUTPUT_MAX_CHARS: ${AGENT_COMMAND_OUTPUT_MAX_CHARS:-100000}
    AGENT_EXECUTION_REPLICAS: ${AGENT_EXECUTION_REPLICAS:-2}
    AGENT_EXECUTION_WORKER_CONCURRENCY: ${AGENT_EXECUTION_WORKER_CONCURRENCY:-2}
    AGENT_EXECUTION_GLOBAL_CONCURRENCY: ${AGENT_EXECUTION_GLOBAL_CONCURRENCY:-4}
    AGENT_EXECUTION_PER_USER_CONCURRENCY: ${AGENT_EXECUTION_PER_USER_CONCURRENCY:-2}
    WEBTERM_OTEL_REQUIRED: ${WEBTERM_OTEL_REQUIRED:-false}
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-webterm}
    OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    AI_CLI_SUBSCRIPTIONS_ENABLED: ${AI_CLI_SUBSCRIPTIONS_ENABLED:-true}
    AI_CLI_RUNNER_MANAGER_URL: http://ai-cli-runner-manager:9000
    AI_CLI_RUNNER_MANAGER_TOKEN: "${AI_CLI_RUNNER_MANAGER_TOKEN:?AI_CLI_RUNNER_MANAGER_TOKEN is required}"
    AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS: ${AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS:-30}
    AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS: ${AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS:-300}
    AI_CLI_AUTH_IN_PROCESS: "false"
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    GROK_API_KEY: ${GROK_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    WEBTERM_ANSIBLE_REQUIRE_ISOLATED: ${WEBTERM_ANSIBLE_REQUIRE_ISOLATED:-true}
    WEBTERM_ANSIBLE_RUNTIME_ROOT: /playbook-runtime
    WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS: ${WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS:-7200}
    WEBTERM_ANSIBLE_DOCKER_RUNTIME_VOLUME: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
    WEBTERM_ANSIBLE_DOCKER_NETWORK: ${WEBTERM_ANSIBLE_DOCKER_NETWORK:-bridge}
    WEBTERM_ANSIBLE_DOCKER_CPUS: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
    WEBTERM_ANSIBLE_DOCKER_MEMORY: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
    WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
    # Optional local/pilot scope. Empty keeps the normal all-active inventory.
    MONITOR_SERVER_ID: ${MONITOR_SERVER_ID:-}
    # Kubernetes Ops stays off in the pilot unless explicitly enabled.
    KUBERNETES_OPS_ENABLED: ${KUBERNETES_OPS_ENABLED:-false}
  volumes:
    - .:/workspace
    - /var/run/docker.sock:/var/run/docker.sock
    - playbook_runtime:/playbook-runtime
    - playbook_validator_socket:/run/playbook-validator
    - mars_codex_home:/mars-codex-home
    - mars_gemini_home:/mars-gemini-home
  # Контейнер работает под uid 10001, а docker.sock смонтирован как root:root 0660.
  # Без группы владельца сокета любой `docker image inspect` внутри воркера падает с
  # permission denied, и изолированный Ansible-образ выглядит как «недоступный».
  # На Docker Desktop (WSL2) gid сокета = 0; на Linux-хосте задайте DOCKER_SOCKET_GID.
  group_add:
    - "${DOCKER_SOCKET_GID:-0}"
  depends_on:
    backend:
      condition: service_healthy
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Worker processes do not expose the backend HTTP readiness endpoint.
  # Disable the image-level web healthcheck for every service using this anchor.
  healthcheck:
    disable: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weu_platform}
      POSTGRES_USER: ${POSTGRES_USER:-weu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weu_secret_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mini_prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weu} -d ${POSTGRES_DB:-weu_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"

  redis:
    image: redis:7-alpine
    container_name: mini-prod-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: webtrerm-backend-dev:latest
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    working_dir: /workspace
    command: ["sh", "-lc", "./docker/render-backend-start.sh"]
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,ai-cli-runner-manager}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,ai-cli-runner-manager}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weu_platform}
      POSTGRES_USER: ${POSTGRES_USER:-weu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weu_secret_change_me}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-this-secret-before-public-deploy-2026-03-12}
      # Тот же ключ, что и у воркеров (см. x-backend-worker): production-настройки
      # требуют MANAGED_SECRET_KEY, и все процессы обязаны шифровать секреты одинаково.
      MANAGED_SECRET_KEY: ${MANAGED_SECRET_KEY:-${DJANGO_SECRET_KEY:-django-insecure-@b9idj_4skbcph+21q6^bc0qbs*$$qs&@7r2sqfn*1#)z5_i%my}}
      CHANNEL_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8080}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://127.0.0.1:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      DJANGO_PORT: 9000
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-web_ui.settings.production}
      KUBERNETES_OPS_ENABLED: ${KUBERNETES_OPS_ENABLED:-false}
      AI_CLI_SUBSCRIPTIONS_ENABLED: ${AI_CLI_SUBSCRIPTIONS_ENABLED:-true}
      AI_CLI_RUNNER_MANAGER_URL: http://ai-cli-runner-manager:9000
      AI_CLI_RUNNER_MANAGER_TOKEN: "${AI_CLI_RUNNER_MANAGER_TOKEN:?AI_CLI_RUNNER_MANAGER_TOKEN is required}"
      AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS: ${AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS:-30}
      AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS: ${AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS:-300}
      AI_CLI_AUTH_IN_PROCESS: "false"
      MARS_AGENT_RUNTIME: ${MARS_AGENT_RUNTIME:-docker}
      MARS_AGENT_DOCKER_IMAGE: ${MARS_AGENT_DOCKER_IMAGE:-webterm-mars-agent:latest}
      MARS_AGENT_DOCKER_NETWORK: ${MARS_AGENT_DOCKER_NETWORK:-bridge}
      MARS_AGENT_DOCKER_CPUS: ${MARS_AGENT_DOCKER_CPUS:-2}
      MARS_AGENT_DOCKER_MEMORY: ${MARS_AGENT_DOCKER_MEMORY:-2g}
      MARS_AGENT_DOCKER_CODEX_HOME_VOLUME: ${MARS_AGENT_DOCKER_CODEX_HOME_VOLUME:-mini-prod-mars-codex-home}
      MARS_AGENT_DOCKER_GEMINI_HOME_VOLUME: ${MARS_AGENT_DOCKER_GEMINI_HOME_VOLUME:-mini-prod-mars-gemini-home}
      MARS_CODEX_HOME: ${MARS_CODEX_HOME:-/mars-codex-home}
      MARS_GEMINI_HOME: ${MARS_GEMINI_HOME:-/mars-gemini-home}
      MARS_DOCKER_CONTAINER_PATH_PREFIX: ${MARS_DOCKER_CONTAINER_PATH_PREFIX:-/workspace}
      MARS_DOCKER_HOST_PATH_PREFIX: ${MARS_DOCKER_HOST_PATH_PREFIX:-}
      AGENT_COMMAND_RUNTIME: ${AGENT_COMMAND_RUNTIME:-docker}
      AGENT_COMMAND_RUNNER_IMAGE: ${AGENT_COMMAND_RUNNER_IMAGE:-}
      AGENT_COMMAND_DOCKER_NETWORK: ${AGENT_COMMAND_DOCKER_NETWORK:-bridge}
      AGENT_COMMAND_DOCKER_CPUS: ${AGENT_COMMAND_DOCKER_CPUS:-0.5}
      AGENT_COMMAND_DOCKER_MEMORY: ${AGENT_COMMAND_DOCKER_MEMORY:-256m}
      AGENT_COMMAND_DOCKER_PIDS_LIMIT: ${AGENT_COMMAND_DOCKER_PIDS_LIMIT:-64}
      AGENT_COMMAND_TIMEOUT_SECONDS: ${AGENT_COMMAND_TIMEOUT_SECONDS:-120}
      AGENT_COMMAND_OUTPUT_MAX_CHARS: ${AGENT_COMMAND_OUTPUT_MAX_CHARS:-100000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
      WEBTERM_ANSIBLE_REQUIRE_ISOLATED: ${WEBTERM_ANSIBLE_REQUIRE_ISOLATED:-true}
      WEBTERM_ANSIBLE_RUNTIME_ROOT: /playbook-runtime
      WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS: ${WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS:-7200}
      WEBTERM_ANSIBLE_DOCKER_RUNTIME_VOLUME: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
      WEBTERM_ANSIBLE_DOCKER_NETWORK: ${WEBTERM_ANSIBLE_DOCKER_NETWORK:-bridge}
      WEBTERM_ANSIBLE_DOCKER_CPUS: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
      WEBTERM_ANSIBLE_DOCKER_MEMORY: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
      WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
    expose:
      - "9000"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - playbook_runtime:/playbook-runtime
      - playbook_validator_socket:/run/playbook-validator
      - mars_codex_home:/mars-codex-home
      - mars_gemini_home:/mars-gemini-home
    # См. комментарий в x-backend-worker: без группы владельца docker.sock
    # процесс под uid 10001 не видит Docker API.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      playbook-validator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/health/', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend-worker
    command:
      [
        "sh",
        "-lc",
        "python manage.py migrate --noinput && python manage.py migrate_ssh_private_keys --apply && python manage.py load_pipeline_templates",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  scheduled-pipelines:
    <<: *backend-worker
    container_name: mini-prod-scheduled-pipelines
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_scheduled_pipelines --daemon --interval ${PIPELINE_SCHEDULER_INTERVAL:-60}",
      ]

  scheduled-agents:
    <<: *backend-worker
    container_name: mini-prod-scheduled-agents
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_scheduled_agents --daemon --interval ${SCHEDULED_AGENTS_INTERVAL:-60} --limit ${SCHEDULED_AGENTS_LIMIT:-100}",
      ]

  agent-execution:
    <<: *backend-worker
    stop_grace_period: 12m
    command:
      [
        "sh",
        "-lc",
        "exec python manage.py run_agent_execution_plane --interval ${AGENT_EXECUTION_INTERVAL:-2} --lease-seconds ${AGENT_EXECUTION_LEASE_SECONDS:-180} --global-concurrency ${AGENT_EXECUTION_GLOBAL_CONCURRENCY:-4} --per-user-concurrency ${AGENT_EXECUTION_PER_USER_CONCURRENCY:-2} --worker-concurrency ${AGENT_EXECUTION_WORKER_CONCURRENCY:-2} --worker-key \"$${HOSTNAME:-compose}\"",
      ]
    deploy:
      replicas: ${AGENT_EXECUTION_REPLICAS:-2}

  operator-execution:
    <<: *backend-worker
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_operator_execution_plane --interval ${OPERATOR_EXECUTION_INTERVAL_SECONDS:-2} --lease-seconds ${OPERATOR_EXECUTION_LEASE_SECONDS:-180} --worker-key \"$${HOSTNAME:-compose}\"",
      ]

  history-pruner:
    <<: *backend-worker
    container_name: mini-prod-history-pruner
    command:
      [
        "python",
        "manage.py",
        "prune_history",
        "--daemon",
        "--interval-seconds",
        "${HISTORY_PRUNE_INTERVAL_SECONDS:-86400}",
        "--batch-size",
        "${HISTORY_PRUNE_BATCH_SIZE:-1000}",
      ]

  playbook-execution-worker:
    <<: *backend-worker
    stop_grace_period: 4m
    command:
      [
        "sh",
        "-lc",
        "exec python manage.py run_playbook_execution_plane --interval ${PLAYBOOK_EXECUTION_INTERVAL_SECONDS:-5} --lease-seconds ${PLAYBOOK_EXECUTION_LEASE_SECONDS:-180} --global-concurrency ${PLAYBOOK_EXECUTION_GLOBAL_CONCURRENCY:-4} --per-user-concurrency ${PLAYBOOK_EXECUTION_PER_USER_CONCURRENCY:-2} --worker-key \"$${HOSTNAME:-compose}\"",
      ]

  ops-supervisor:
    <<: *backend-worker
    container_name: mini-prod-ops-supervisor
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_ops_supervisor --without-agent-execution --with-watchers --dream-interval ${MEMORY_DREAM_INTERVAL:-300} --watchers-interval ${WATCHERS_INTERVAL:-120} --watchers-limit ${WATCHERS_LIMIT:-100}",
      ]

  kubernetes-ops-sync:
    <<: *backend-worker
    container_name: mini-prod-kubernetes-ops-sync
    profiles: ["kubernetes-ops"]
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_kubernetes_ops_sync_worker --daemon --interval ${KUBERNETES_OPS_SYNC_INTERVAL_SECONDS:-300} --worker-key compose",
      ]

  celery-worker:
    <<: *backend-worker
    container_name: mini-prod-celery-worker
    command:
      [
        "sh",
        "-lc",
        "python -m celery -A web_ui worker -l ${CELERY_LOG_LEVEL:-info} --concurrency ${CELERY_WORKER_CONCURRENCY:-2}",
      ]

  monitor:
    <<: *backend-worker
    container_name: mini-prod-monitor
    command:
      [
        "sh",
        "-lc",
        "exec python manage.py run_monitor --full-quick --quick-interval ${MONITOR_QUICK_INTERVAL:-60} --deep-interval ${MONITOR_DEEP_INTERVAL:-600} --concurrency ${MONITOR_CONCURRENCY:-5} $${MONITOR_SERVER_ID:+--server-id $${MONITOR_SERVER_ID}}",
      ]

  # Local/pilot AI subscription plane. It is part of the default stack so a
  # Docker restart cannot leave the UI enabled while the runner is absent.
  ai-cli-docker-proxy:
    image: ${WEBTERM_AI_CLI_DOCKER_PROXY_IMAGE:-webterm-ai-cli-docker-proxy:local}
    build:
      context: .
      dockerfile: docker/playbook-socket-proxy.Dockerfile
    container_name: mini-prod-ai-cli-docker-proxy
    user: "10002:10002"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    environment:
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DOCKER_PROXY_POLICY: ai-cli
      AI_CLI_CODEX_RUNNER_IMAGE: ${AI_CLI_CODEX_RUNNER_IMAGE:?AI_CLI_CODEX_RUNNER_IMAGE is required}
      AI_CLI_GROK_RUNNER_IMAGE: ${AI_CLI_GROK_RUNNER_IMAGE:?AI_CLI_GROK_RUNNER_IMAGE is required}
      AI_CLI_DOCKER_NETWORK: ${AI_CLI_DOCKER_NETWORK:-webterm-ai-cli-egress}
      AI_CLI_CREDENTIAL_VOLUME_PREFIX: ${AI_CLI_CREDENTIAL_VOLUME_PREFIX:-webterm-ai-cli-cred-}
      AI_CLI_EGRESS_PROXY_URL: ${AI_CLI_EGRESS_PROXY_URL:-http://ai-cli-egress-proxy:3128}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - docker-control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10002,gid=10002,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  ai-cli-egress-proxy:
    image: ${WEBTERM_AI_CLI_EGRESS_PROXY_IMAGE:-webterm-ai-cli-egress-proxy:local}
    build:
      context: .
      dockerfile: docker/ai-cli-egress-proxy.Dockerfile
    container_name: mini-prod-ai-cli-egress-proxy
    user: "10003:10003"
    networks:
      - default
      - ai-cli-egress
    expose:
      - "3128"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10003,gid=10003,mode=1770
      - /var/cache/squid:rw,noexec,nosuid,nodev,size=64m,uid=10003,gid=10003,mode=0700
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,uid=10003,gid=10003,mode=0700
      - /run/squid:rw,noexec,nosuid,nodev,size=4m,uid=10003,gid=10003,mode=0700
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  ai-cli-runner-manager:
    image: ${WEBTERM_AI_CLI_RUNNER_MANAGER_IMAGE:-webterm-ai-cli-runner-manager:local}
    build:
      context: .
      dockerfile: docker/ai-cli-runner-manager.Dockerfile
    container_name: mini-prod-ai-cli-runner-manager
    environment:
      DOCKER_HOST: tcp://ai-cli-docker-proxy:2375
      AI_CLI_RUNNER_MANAGER_TOKEN: "${AI_CLI_RUNNER_MANAGER_TOKEN:?AI_CLI_RUNNER_MANAGER_TOKEN is required}"
      AI_CLI_CODEX_RUNNER_IMAGE: ${AI_CLI_CODEX_RUNNER_IMAGE:?AI_CLI_CODEX_RUNNER_IMAGE is required}
      AI_CLI_GROK_RUNNER_IMAGE: ${AI_CLI_GROK_RUNNER_IMAGE:?AI_CLI_GROK_RUNNER_IMAGE is required}
      AI_CLI_DOCKER_NETWORK: ${AI_CLI_DOCKER_NETWORK:-webterm-ai-cli-egress}
      AI_CLI_CREDENTIAL_VOLUME_PREFIX: ${AI_CLI_CREDENTIAL_VOLUME_PREFIX:-webterm-ai-cli-cred-}
      AI_CLI_EGRESS_PROXY_URL: ${AI_CLI_EGRESS_PROXY_URL:-http://ai-cli-egress-proxy:3128}
      AI_CLI_DOCKER_CPUS: ${AI_CLI_DOCKER_CPUS:-1.0}
      AI_CLI_DOCKER_MEMORY: ${AI_CLI_DOCKER_MEMORY:-1g}
      AI_CLI_DOCKER_PIDS_LIMIT: ${AI_CLI_DOCKER_PIDS_LIMIT:-128}
      AI_CLI_REQUEST_TIMEOUT_SECONDS: ${AI_CLI_REQUEST_TIMEOUT_SECONDS:-900}
      AI_CLI_OUTPUT_LIMIT_BYTES: ${AI_CLI_OUTPUT_LIMIT_BYTES:-2097152}
    ports:
      - "127.0.0.1:${AI_CLI_RUNNER_MANAGER_PORT:-19090}:9000"
    networks:
      - default
      - docker-control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      ai-cli-docker-proxy:
        condition: service_healthy
      ai-cli-egress-proxy:
        condition: service_healthy
    restart: unless-stopped

  ai-provider-auth:
    <<: *backend-worker
    container_name: mini-prod-ai-provider-auth
    command:
      [
        "sh",
        "-lc",
        "exec python manage.py run_ai_provider_auth_worker --interval ${AI_CLI_AUTH_WORKER_INTERVAL_SECONDS:-2} --concurrency ${AI_CLI_AUTH_WORKER_CONCURRENCY:-4} --worker-key \"$${HOSTNAME:-compose}\"",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-cli-runner-manager:
        condition: service_healthy

  telegram-bot:
    <<: *backend-worker
    container_name: mini-prod-telegram-bot
    profiles: ["telegram-bot"]
    command: ["sh", "-lc", "python manage.py run_telegram_bot"]

  mars-agent:
    build:
      context: .
      dockerfile: docker/mars-agent.Dockerfile
      args:
        CODEX_NPM_PACKAGE: ${MARS_CODEX_NPM_PACKAGE:-@openai/codex@0.139.0}
        GEMINI_NPM_PACKAGE: ${MARS_GEMINI_NPM_PACKAGE:-@google/gemini-cli@0.46.0}
    image: ${MARS_AGENT_DOCKER_IMAGE:-webterm-mars-agent:latest}
    profiles: ["mars-agent"]
    command: ["node", "--version"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    container_name: mini-prod-frontend
    working_dir: /workspace/frontend
    command: ["sh", "-lc", "npm run build && npx vite preview --host 0.0.0.0 --port 8080"]
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      ftp_proxy: ${ftp_proxy:-}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,nginx}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,postgres,redis,mcp-demo,backend,frontend,nginx}
      VITE_DJANGO_URL: http://backend:9000
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    expose:
      - "8080"
    volumes:
      - ./frontend:/workspace/frontend
      - mini_prod_frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-prod-nginx
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mcp-demo:
    image: python:3.12-slim
    container_name: mini-prod-mcp-demo
    working_dir: /workspace
    command: ["python", "studio/demo_mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${STUDIO_MCP_DEMO_PORT:-8765}:8765"
    volumes:
      - .:/workspace
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ansible runner image only — not a long-running service.
  # Build: docker compose --profile ansible build ansible-runner
  # Backend starts ad-hoc: docker run --rm -v workdir:/ansible webterm-ansible:latest ...
  ansible-runner:
    profiles: ["ansible"]
    image: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    build:
      context: .
      dockerfile: docker/ansible-runner/Dockerfile
    entrypoint: ["ansible-playbook"]
    command: ["--version"]
    restart: "no"

  # Build-only, single-shot image. The application starts one hardened
  # container for each agent SSH command and sends credentials only on stdin.
  agent-command-runner:
    profiles: ["agent-runner"]
    image: ${AGENT_COMMAND_RUNNER_BUILD_IMAGE:-webterm-agent-command-runner:latest}
    build:
      context: .
      dockerfile: docker/agent-command-runner/Dockerfile
    command: []
    restart: "no"

  playbook-validator:
    image: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    build:
      context: .
      dockerfile: docker/ansible-runner/Dockerfile
    user: "0:0"
    entrypoint: ["python", "/opt/webterm/validator.py"]
    command: []
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
    cpus: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      ANSIBLE_VALIDATOR_MAX_CONCURRENCY: ${ANSIBLE_VALIDATOR_MAX_CONCURRENCY:-4}
      ANSIBLE_VALIDATOR_READ_TIMEOUT_SECONDS: ${ANSIBLE_VALIDATOR_READ_TIMEOUT_SECONDS:-10}
    volumes:
      - playbook_validator_socket:/run/playbook-validator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/opt/webterm/validator.py", "--healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  mini_prod_postgres_data:
  mini_prod_frontend_node_modules:
  mars_codex_home:
    name: ${MARS_AGENT_DOCKER_CODEX_HOME_VOLUME:-mini-prod-mars-codex-home}
  mars_gemini_home:
    name: ${MARS_AGENT_DOCKER_GEMINI_HOME_VOLUME:-mini-prod-mars-gemini-home}
  playbook_runtime:
    name: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
  playbook_validator_socket:

networks:
  docker-control:
    internal: true
  ai-cli-egress:
    name: ${AI_CLI_DOCKER_NETWORK:-webterm-ai-cli-egress}
    internal: true
