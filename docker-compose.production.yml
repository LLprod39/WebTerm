      [
        "sh",
        "-lc",
        "exec python manage.py run_agent_execution_plane --interval ${AGENT_EXECUTION_INTERVAL:-2} --lease-seconds ${AGENT_EXECUTION_LEASE_SECONDS:-180} --global-concurrency ${AGENT_EXECUTION_GLOBAL_CONCURRENCY:-10} --per-user-concurrency ${AGENT_EXECUTION_PER_USER_CONCURRENCY:-2} --worker-concurrency ${AGENT_EXECUTION_WORKER_CONCURRENCY:-2} --worker-key \"$${HOSTNAME:-production}\"",
      ]
    deploy:
      replicas: ${AGENT_EXECUTION_REPLICAS:-5}

