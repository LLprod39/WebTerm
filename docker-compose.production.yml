      AGENT_COMMAND_DOCKER_NETWORK: ${AGENT_COMMAND_DOCKER_NETWORK:-bridge}
      AGENT_COMMAND_SSH_AUTH_SOCK: ${AGENT_COMMAND_SSH_AUTH_SOCK:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
