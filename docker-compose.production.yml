# Production stack for WebTerm / mini_prod.
# Quick start:
#   1. Copy .env.production.example to .env.production
#   2. Fill real hostnames if you expose the app outside localhost
#   3. Run: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build

x-proxy-env: &proxy-env
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  ftp_proxy: ${ftp_proxy:-}
  no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  FTP_PROXY: ${FTP_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  args:
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    ftp_proxy: ${ftp_proxy:-}
    no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    FTP_PROXY: ${FTP_PROXY:-}
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner

x-backend-worker: &backend-worker
  build: *backend-build
  env_file:
    - .env.production
  environment:
    <<: *proxy-env
    WEU_BUILD: ${WEU_BUILD:-prod}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-web_ui.settings.production}
    MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-/workspace/config_runtime/model_config.json}
    NOTIFICATION_CONFIG_PATH: ${NOTIFICATION_CONFIG_PATH:-/workspace/config_runtime/notification_config.json}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL:-redis://redis:6379/1}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    # MCP Runner: workers execute agent/pipeline MCP calls too, so they route
    # stdio MCP through the shared runner instead of spawning on the host.
    STUDIO_MCP_RUNNER_URL: ${STUDIO_MCP_RUNNER_URL:-http://mcp-runner:9000}
    STUDIO_MCP_RUNNER_TOKEN: ${STUDIO_MCP_RUNNER_TOKEN:-}
    WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    WEBTERM_ANSIBLE_REQUIRE_ISOLATED: "true"
    WEBTERM_ANSIBLE_RUNTIME_ROOT: /playbook-runtime
    WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS: ${WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS:-7200}
    WEBTERM_ANSIBLE_DOCKER_RUNTIME_VOLUME: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
    WEBTERM_ANSIBLE_DOCKER_NETWORK: ${WEBTERM_ANSIBLE_DOCKER_NETWORK:-bridge}
    WEBTERM_ANSIBLE_DOCKER_CPUS: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
    WEBTERM_ANSIBLE_DOCKER_MEMORY: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
    WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
    # Keep this fixed to the private named-volume target. Do not accept an
    # env_file override that could silently send a worker to ephemeral storage.
    PLAYBOOK_BUNDLE_STORAGE_ROOT: /workspace/private/playbook_bundles
  volumes:
    - mini_prod_media:/workspace/media
    - mini_prod_staticfiles:/workspace/staticfiles
    - mini_prod_config:/workspace/config_runtime
    - mini_prod_logs:/workspace/logs
    - ./docker/ldap:/etc/webtrerm/ldap:ro
    - playbook_validator_socket:/run/playbook-validator
  depends_on:
    backend:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 45s
  logging: *json-logging

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mini_prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    logging: *json-logging

  redis:
    image: redis:7-alpine
    container_name: mini-prod-redis
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - mini_prod_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *json-logging

  backend:
    build: *backend-build
    container_name: mini-prod-backend
    command: ["sh", "-lc", "./docker/render-backend-start.sh"]
    env_file:
      - .env.production
    environment:
      <<: *proxy-env
      WEU_BUILD: ${WEU_BUILD:-prod}
      DJANGO_SETTINGS_MODULE: web_ui.settings.production
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # DJANGO_SECRET_KEY и MANAGED_SECRET_KEY намеренно НЕ переопределяются здесь:
      # они приходят только из env_file (.env.production), как и у worker-сервисов.
      # Переопределение через ${VAR} затирало значение из env_file пустой строкой,
      # когда переменная не задана в shell — backend и workers получали разные ключи
      # шифрования managed secrets ("Managed secret cannot be decrypted...").
      MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-/workspace/config_runtime/model_config.json}
      NOTIFICATION_CONFIG_PATH: ${NOTIFICATION_CONFIG_PATH:-/workspace/config_runtime/notification_config.json}
      DJANGO_PORT: "9000"
      PORT: "9000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # POSTGRES_DB/USER/PASSWORD, SITE_URL, FRONTEND_APP_URL, ALLOWED_HOSTS и
      # CSRF_TRUSTED_ORIGINS приходят из env_file (.env.production) — как у workers.
      # Незащищённые ${VAR}-переопределения затирали их пустыми строками, если
      # переменные не заданы в shell при `docker compose up`.
      CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      APP_LOG_FILE: ${APP_LOG_FILE:-/workspace/logs/webtrerm.log}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_ROTATION: ${APP_LOG_ROTATION:-50 MB}
      APP_LOG_RETENTION: ${APP_LOG_RETENTION:-14 days}
      APP_LOG_SYSLOG_ENABLED: ${APP_LOG_SYSLOG_ENABLED:-false}
      APP_LOG_SYSLOG_ADDRESS: ${APP_LOG_SYSLOG_ADDRESS:-localhost:514}
      APP_LOG_SYSLOG_PROTOCOL: ${APP_LOG_SYSLOG_PROTOCOL:-udp}
      APP_LOG_SYSLOG_FACILITY: ${APP_LOG_SYSLOG_FACILITY:-LOG_USER}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-true}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-true}
      CROSS_SITE_AUTH: ${CROSS_SITE_AUTH:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_CLI_HTTP_1: ${CURSOR_CLI_HTTP_1:-1}
      CURSOR_CLI_EXTRA_ENV: ${CURSOR_CLI_EXTRA_ENV:-}
      CLI_RUNTIME_TIMEOUT_SECONDS: ${CLI_RUNTIME_TIMEOUT_SECONDS:-600}
      CLI_FIRST_OUTPUT_TIMEOUT_SECONDS: ${CLI_FIRST_OUTPUT_TIMEOUT_SECONDS:-120}
      DOMAIN_AUTH_ENABLED: ${DOMAIN_AUTH_ENABLED:-false}
      DOMAIN_AUTH_HEADER: ${DOMAIN_AUTH_HEADER:-REMOTE_USER}
      DOMAIN_AUTH_HEADER_ALIASES: ${DOMAIN_AUTH_HEADER_ALIASES:-}
      DOMAIN_AUTH_AUTO_CREATE: ${DOMAIN_AUTH_AUTO_CREATE:-true}
      DOMAIN_AUTH_LOWERCASE_USERNAMES: ${DOMAIN_AUTH_LOWERCASE_USERNAMES:-true}
      DOMAIN_AUTH_DEFAULT_PROFILE: ${DOMAIN_AUTH_DEFAULT_PROFILE:-server_only}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVERS: ${LDAP_SERVERS:-}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_PORT: ${LDAP_PORT:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_FILTER: ${LDAP_FILTER:-(objectClass=user)}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-sAMAccountName}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
      LDAP_FULL_NAME_ATTRIBUTE: ${LDAP_FULL_NAME_ATTRIBUTE:-cn}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_IGNORE_CERT: ${LDAP_IGNORE_CERT:-false}
      LDAP_CA_CERT_FILE: ${LDAP_CA_CERT_FILE:-}
      LDAP_CA_CERT_DIR: ${LDAP_CA_CERT_DIR:-}
      LDAP_NETWORK_TIMEOUT_SECONDS: ${LDAP_NETWORK_TIMEOUT_SECONDS:-3}
      LDAP_DEFAULT_PROFILE: ${LDAP_DEFAULT_PROFILE:-server_only}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      PIPELINE_NOTIFY_EMAIL: ${PIPELINE_NOTIFY_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STUDIO_MCP_DEMO_URL: ${STUDIO_MCP_DEMO_URL:-http://mcp-demo:8765/mcp}
      # MCP Runner: when set, stdio MCP servers run isolated in the runner (not on
      # this host) and become available to non-admins. Set STUDIO_MCP_RUNNER_TOKEN
      # to a strong shared secret so only the backend can reach the runner.
      STUDIO_MCP_RUNNER_URL: ${STUDIO_MCP_RUNNER_URL:-http://mcp-runner:9000}
      STUDIO_MCP_RUNNER_TOKEN: ${STUDIO_MCP_RUNNER_TOKEN:-}
      # Production HTTP processes intentionally have no Docker socket. Runtime
      # execution is owned by the durable playbook worker below.
      WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
      WEBTERM_ANSIBLE_REQUIRE_ISOLATED: "true"
      WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
      PLAYBOOK_BUNDLE_STORAGE_ROOT: /workspace/private/playbook_bundles
    ports:
      - "${DJANGO_BIND_HOST:-127.0.0.1}:${DJANGO_HOST_PORT:-9000}:9000"
    volumes:
      - mini_prod_media:/workspace/media
      - playbook_bundles:/workspace/private/playbook_bundles
      - mini_prod_staticfiles:/workspace/staticfiles
      - mini_prod_config:/workspace/config_runtime
      - mini_prod_logs:/workspace/logs
      - ./docker/ldap:/etc/webtrerm/ldap:ro
      - playbook_validator_socket:/run/playbook-validator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-demo:
        condition: service_healthy
      mcp-runner:
        condition: service_healthy
      playbook-validator:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://127.0.0.1:9000/api/health/', headers={'X-Forwarded-Proto': 'https', 'Host': '127.0.0.1'}); urllib.request.urlopen(req, timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *json-logging

  scheduled-pipelines:
    <<: *backend-worker
    container_name: mini-prod-scheduled-pipelines
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_scheduled_pipelines --daemon --interval ${PIPELINE_SCHEDULER_INTERVAL:-60}",
      ]

  scheduled-agents:
    <<: *backend-worker
    container_name: mini-prod-scheduled-agents
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_scheduled_agents --daemon --interval ${SCHEDULED_AGENTS_INTERVAL:-60} --limit ${SCHEDULED_AGENTS_LIMIT:-100}",
      ]

  playbook-execution-worker:
    <<: *backend-worker
    stop_grace_period: 4m
    volumes:
      - mini_prod_media:/workspace/media
      - playbook_bundles:/workspace/private/playbook_bundles
      - mini_prod_staticfiles:/workspace/staticfiles
      - mini_prod_config:/workspace/config_runtime
      - mini_prod_logs:/workspace/logs
      - ./docker/ldap:/etc/webtrerm/ldap:ro
      - playbook_runtime:/playbook-runtime
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "sh",
        "-lc",
        "exec python manage.py run_playbook_execution_plane --interval ${PLAYBOOK_EXECUTION_INTERVAL_SECONDS:-5} --lease-seconds ${PLAYBOOK_EXECUTION_LEASE_SECONDS:-180} --global-concurrency ${PLAYBOOK_EXECUTION_GLOBAL_CONCURRENCY:-4} --per-user-concurrency ${PLAYBOOK_EXECUTION_PER_USER_CONCURRENCY:-2} --worker-key \"$${HOSTNAME:-production}\"",
      ]

  ansible-runner:
    profiles: ["ansible"]
    image: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    build:
      context: .
      dockerfile: docker/ansible-runner/Dockerfile
    entrypoint: ["ansible-playbook"]
    command: ["--version"]
    restart: "no"

  playbook-validator:
    image: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
    build:
      context: .
      dockerfile: docker/ansible-runner/Dockerfile
    user: "0:0"
    entrypoint: ["python", "/opt/webterm/validator.py"]
    command: []
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
    cpus: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      ANSIBLE_VALIDATOR_MAX_CONCURRENCY: ${ANSIBLE_VALIDATOR_MAX_CONCURRENCY:-4}
      ANSIBLE_VALIDATOR_READ_TIMEOUT_SECONDS: ${ANSIBLE_VALIDATOR_READ_TIMEOUT_SECONDS:-10}
    volumes:
      - playbook_validator_socket:/run/playbook-validator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/opt/webterm/validator.py", "--healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  monitor:
    <<: *backend-worker
    container_name: mini-prod-monitor
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_monitor --full-quick --quick-interval ${MONITOR_QUICK_INTERVAL:-60} --deep-interval ${MONITOR_DEEP_INTERVAL:-600} --cleanup-interval ${MONITOR_CLEANUP_INTERVAL:-86400} --concurrency ${MONITOR_CONCURRENCY:-5}",
      ]

  ops-supervisor:
    <<: *backend-worker
    container_name: mini-prod-ops-supervisor
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_ops_supervisor --with-watchers --dream-interval ${MEMORY_DREAM_INTERVAL:-300} --execution-interval ${AGENT_EXECUTION_INTERVAL:-5} --watchers-interval ${WATCHERS_INTERVAL:-120} --watchers-limit ${WATCHERS_LIMIT:-100}",
      ]

  kubernetes-ops-sync:
    <<: *backend-worker
    container_name: mini-prod-kubernetes-ops-sync
    command:
      [
        "sh",
        "-lc",
        "python manage.py run_kubernetes_ops_sync_worker --daemon --interval ${KUBERNETES_OPS_SYNC_INTERVAL_SECONDS:-300} --worker-key production",
      ]

  celery-worker:
    <<: *backend-worker
    container_name: mini-prod-celery-worker
    command:
      [
        "sh",
        "-lc",
        "python -m celery -A web_ui worker -l ${CELERY_LOG_LEVEL:-info} --concurrency ${CELERY_WORKER_CONCURRENCY:-2}",
      ]

  telegram-bot:
    <<: *backend-worker
    container_name: mini-prod-telegram-bot
    profiles: ["telegram-bot"]
    command: ["sh", "-lc", "python manage.py run_telegram_bot"]

  mars-agent:
    build:
      context: .
      dockerfile: docker/mars-agent.Dockerfile
      args:
        CODEX_NPM_PACKAGE: ${MARS_CODEX_NPM_PACKAGE:-@openai/codex@0.139.0}
        GEMINI_NPM_PACKAGE: ${MARS_GEMINI_NPM_PACKAGE:-@google/gemini-cli@0.46.0}
    image: ${MARS_AGENT_DOCKER_IMAGE:-webterm-mars-agent:latest}
    profiles: ["mars-agent"]
    command: ["node", "--version"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
    container_name: mini-prod-frontend
    environment:
      NODE_ENV: production
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *json-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-prod-nginx
    ports:
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:8080"
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-8080}:8080"
      - "${PUBLIC_BIND_HOST:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:8443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - mini_prod_staticfiles:/srv/static:ro
      - mini_prod_media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *json-logging

  mcp-demo:
    build:
      context: .
      dockerfile: docker/demo-mcp.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
    container_name: mini-prod-mcp-demo
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${STUDIO_MCP_DEMO_PORT:-8765}:8765"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *json-logging

  mcp-runner:
    build:
      context: .
      dockerfile: docker/mcp-runner.Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ftp_proxy: ${ftp_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-demo,mcp-runner
    container_name: mini-prod-mcp-runner
    environment:
      <<: *proxy-env
      MCP_RUNNER_TOKEN: ${STUDIO_MCP_RUNNER_TOKEN:-}
      MCP_RUNNER_SESSION_TTL_SECONDS: ${MCP_RUNNER_SESSION_TTL_SECONDS:-300}
      MCP_RUNNER_MAX_SESSIONS: ${MCP_RUNNER_MAX_SESSIONS:-50}
      MCP_RUNNER_REQUEST_TIMEOUT_SECONDS: ${MCP_RUNNER_REQUEST_TIMEOUT_SECONDS:-120}
    # Internal only: reachable by the backend over the compose network, never
    # published to the host.
    expose:
      - "9000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *json-logging

volumes:
  mini_prod_postgres_data:
  mini_prod_redis_data:
  mini_prod_media:
  mini_prod_staticfiles:
  mini_prod_config:
  mini_prod_logs:
  playbook_bundles:
  playbook_runtime:
    name: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
  playbook_validator_socket:
