        "sh",
        "-lc",
        "python manage.py run_pipeline_execution_plane --interval ${PIPELINE_EXECUTION_INTERVAL_SECONDS:-5} --lease-seconds ${PIPELINE_EXECUTION_LEASE_SECONDS:-180} --global-concurrency ${PIPELINE_EXECUTION_GLOBAL_CONCURRENCY:-4} --per-user-concurrency ${PIPELINE_EXECUTION_PER_USER_CONCURRENCY:-2} --worker-key \"$${HOSTNAME:-production}\"",
      ]

