# Production stack for WebTerm / mini_prod.
# Quick start:
#   1. Copy .env.production.example to .env.production
#   2. Fill real hostnames if you expose the app outside localhost
#   3. Run: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build

x-proxy-env: &proxy-env
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  ftp_proxy: ${ftp_proxy:-}
  no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-runner,ai-cli-runner-manager,playbook-docker-proxy,agent-command-docker-proxy,plugin-backend-docker-proxy
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  FTP_PROXY: ${FTP_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-runner,ai-cli-runner-manager,playbook-docker-proxy,agent-command-docker-proxy,plugin-backend-docker-proxy

x-build-proxy-args: &build-proxy-args
  http_proxy: ${http_proxy:-}
  https_proxy: ${https_proxy:-}
  ftp_proxy: ${ftp_proxy:-}
  no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-runner
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  FTP_PROXY: ${FTP_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,redis,backend,frontend,nginx,mcp-runner

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  args: *build-proxy-args

x-backend-worker-environment: &backend-worker-environment
  <<: *proxy-env
  WEU_BUILD: ${WEU_BUILD:-prod}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-web_ui.settings.production}
  MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-/workspace/config_runtime/model_config.json}
  NOTIFICATION_CONFIG_PATH: ${NOTIFICATION_CONFIG_PATH:-/workspace/config_runtime/notification_config.json}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL:-redis://redis:6379/1}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  # MCP Runner: workers execute agent/pipeline MCP calls too, so they route
  # stdio MCP through the shared runner instead of spawning on the host.
  STUDIO_MCP_RUNNER_URL: ${STUDIO_MCP_RUNNER_URL:-http://mcp-runner:9000}
  STUDIO_MCP_RUNNER_TOKEN: "${STUDIO_MCP_RUNNER_TOKEN:?STUDIO_MCP_RUNNER_TOKEN is required}"
  AI_CLI_SUBSCRIPTIONS_ENABLED: ${AI_CLI_SUBSCRIPTIONS_ENABLED:-false}
  AI_CLI_RUNNER_MANAGER_URL: ${AI_CLI_RUNNER_MANAGER_URL:-http://ai-cli-runner-manager:9000}
  AI_CLI_RUNNER_MANAGER_TOKEN: ${AI_CLI_RUNNER_MANAGER_TOKEN:-}
  AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS: ${AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS:-30}
  AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS: ${AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS:-300}
  PILOT_RESTRICTED_MODE: ${PILOT_RESTRICTED_MODE:-false}
  PILOT_SSH_ALLOWED_HOSTS: ${PILOT_SSH_ALLOWED_HOSTS:-}
  PILOT_SSH_ALLOWED_CIDRS: ${PILOT_SSH_ALLOWED_CIDRS:-}
  PILOT_SSH_ALLOWED_PORTS: ${PILOT_SSH_ALLOWED_PORTS:-}
  WEBTERM_OTEL_REQUIRED: ${WEBTERM_OTEL_REQUIRED:-false}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-webterm-worker}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
  WEBTERM_ENVIRONMENT: ${WEBTERM_ENVIRONMENT:-production}
  WEBTERM_PROCESS_ROLE: ${WEBTERM_PROCESS_ROLE:-worker}
  DOCKER_HOST: tcp://agent-command-docker-proxy:2375
  AGENT_COMMAND_RUNTIME: docker
  AGENT_COMMAND_RUNNER_IMAGE: "${AGENT_COMMAND_RUNNER_IMAGE:?AGENT_COMMAND_RUNNER_IMAGE is required}"
  AGENT_COMMAND_DOCKER_NETWORK: ${AGENT_COMMAND_DOCKER_NETWORK:-bridge}
  AGENT_COMMAND_DOCKER_CPUS: ${AGENT_COMMAND_DOCKER_CPUS:-0.5}
  AGENT_COMMAND_DOCKER_MEMORY: ${AGENT_COMMAND_DOCKER_MEMORY:-256m}
  AGENT_COMMAND_DOCKER_PIDS_LIMIT: ${AGENT_COMMAND_DOCKER_PIDS_LIMIT:-64}
  AGENT_COMMAND_TIMEOUT_SECONDS: ${AGENT_COMMAND_TIMEOUT_SECONDS:-120}
  AGENT_COMMAND_OUTPUT_MAX_CHARS: ${AGENT_COMMAND_OUTPUT_MAX_CHARS:-100000}
  AGENT_EXECUTION_REPLICAS: ${AGENT_EXECUTION_REPLICAS:-5}
  AGENT_EXECUTION_WORKER_CONCURRENCY: ${AGENT_EXECUTION_WORKER_CONCURRENCY:-2}
  AGENT_EXECUTION_GLOBAL_CONCURRENCY: ${AGENT_EXECUTION_GLOBAL_CONCURRENCY:-10}
  AGENT_EXECUTION_PER_USER_CONCURRENCY: ${AGENT_EXECUTION_PER_USER_CONCURRENCY:-2}
  PLUGIN_BACKEND_DOCKER_HOST: tcp://plugin-backend-docker-proxy:2375
  PLUGIN_BACKEND_RUNNER_IMAGE: ${PLUGIN_BACKEND_RUNNER_IMAGE:-}
  PLUGIN_BACKEND_DOCKER_EGRESS_NETWORK: ${PLUGIN_BACKEND_DOCKER_EGRESS_NETWORK:-}
  PLUGIN_BACKEND_DOCKER_CPUS: ${PLUGIN_BACKEND_DOCKER_CPUS:-0.5}
  PLUGIN_BACKEND_DOCKER_MEMORY: ${PLUGIN_BACKEND_DOCKER_MEMORY:-128m}
  PLUGIN_BACKEND_DOCKER_PIDS_LIMIT: ${PLUGIN_BACKEND_DOCKER_PIDS_LIMIT:-32}
  WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
  WEBTERM_ANSIBLE_REQUIRE_ISOLATED: "true"
  WEBTERM_ANSIBLE_RUNTIME_ROOT: /playbook-runtime
  WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS: ${WEBTERM_ANSIBLE_RUNTIME_TTL_SECONDS:-7200}
  WEBTERM_ANSIBLE_DOCKER_RUNTIME_VOLUME: ${PLAYBOOK_RUNTIME_VOLUME_NAME:-mini_prod_playbook_runtime}
  WEBTERM_ANSIBLE_DOCKER_NETWORK: ${WEBTERM_ANSIBLE_DOCKER_NETWORK:-bridge}
  WEBTERM_ANSIBLE_DOCKER_CPUS: ${WEBTERM_ANSIBLE_DOCKER_CPUS:-1.0}
  WEBTERM_ANSIBLE_DOCKER_MEMORY: ${WEBTERM_ANSIBLE_DOCKER_MEMORY:-512m}
  WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
  # Keep this fixed to the private named-volume target. Do not accept an
  # env_file override that could silently send a worker to ephemeral storage.
  PLAYBOOK_BUNDLE_STORAGE_ROOT: /workspace/private/playbook_bundles
  # Only the telegram-bot service is allowed to consume getUpdates.
  TELEGRAM_BOT_POLL_TOKEN: ""

x-backend-worker: &backend-worker
  image: ${WEBTERM_BACKEND_IMAGE:-webterm-backend:latest}
  build: *backend-build
  env_file:
    - .env.production
  environment: *backend-worker-environment
  volumes:
    - mini_prod_media:/workspace/media
    - mini_prod_staticfiles:/workspace/staticfiles
    - mini_prod_config:/workspace/config_runtime
    - mini_prod_logs:/workspace/logs
    - ./docker/ldap:/etc/webtrerm/ldap:ro
    - playbook_validator_socket:/run/playbook-validator
  networks:
    - default
    - docker-control
  depends_on:
    backend:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    agent-command-docker-proxy:
      condition: service_healthy
    plugin-backend-docker-proxy:
      condition: service_healthy
  restart: unless-stopped
  stop_grace_period: 45s
  mem_limit: ${WEBTERM_BACKEND_WORKER_MEMORY:-768m}
  cpus: ${WEBTERM_BACKEND_WORKER_CPUS:-1.0}
  pids_limit: ${WEBTERM_BACKEND_WORKER_PIDS_LIMIT:-256}
  healthcheck:
    disable: true
  logging: *json-logging

services:
  volume-permissions:
    image: ${WEBTERM_BACKEND_IMAGE:-webterm-backend:latest}
    build: *backend-build
    user: "0:0"
    entrypoint: ["sh", "-lc"]
    command:
      - >-
        chown -R 10001:10001
        /workspace/media
        /workspace/staticfiles
        /workspace/config_runtime
        /workspace/logs
        /workspace/private/playbook_bundles
        /playbook-runtime
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - mini_prod_media:/workspace/media
      - mini_prod_staticfiles:/workspace/staticfiles
      - mini_prod_config:/workspace/config_runtime
      - mini_prod_logs:/workspace/logs
      - playbook_bundles:/workspace/private/playbook_bundles
      - playbook_runtime:/playbook-runtime

  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: mini-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mini_prod_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    logging: *json-logging

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: mini-prod-redis
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - mini_prod_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *json-logging

  backend:
    image: ${WEBTERM_BACKEND_IMAGE:-webterm-backend:latest}
    build: *backend-build
    command: ["sh", "-lc", "./docker/render-backend-start.sh"]
    env_file:
      - .env.production
    environment:
      <<: *proxy-env
      WEU_BUILD: ${WEU_BUILD:-prod}
      DJANGO_SETTINGS_MODULE: web_ui.settings.production
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # DJANGO_SECRET_KEY и MANAGED_SECRET_KEY намеренно НЕ переопределяются здесь:
      # они приходят только из env_file (.env.production), как и у worker-сервисов.
      # Переопределение через ${VAR} затирало значение из env_file пустой строкой,
      # когда переменная не задана в shell — backend и workers получали разные ключи
      # шифрования managed secrets ("Managed secret cannot be decrypted...").
      MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-/workspace/config_runtime/model_config.json}
      NOTIFICATION_CONFIG_PATH: ${NOTIFICATION_CONFIG_PATH:-/workspace/config_runtime/notification_config.json}
      DJANGO_PORT: "9000"
      PORT: "9000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # POSTGRES_DB/USER/PASSWORD, SITE_URL, FRONTEND_APP_URL, ALLOWED_HOSTS и
      # CSRF_TRUSTED_ORIGINS приходят из env_file (.env.production) — как у workers.
      # Незащищённые ${VAR}-переопределения затирали их пустыми строками, если
      # переменные не заданы в shell при `docker compose up`.
      CHANNEL_REDIS_URL: ${CHANNEL_REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      APP_LOG_FILE: ${APP_LOG_FILE:-/workspace/logs/webtrerm.log}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_ROTATION: ${APP_LOG_ROTATION:-50 MB}
      APP_LOG_RETENTION: ${APP_LOG_RETENTION:-14 days}
      APP_LOG_SYSLOG_ENABLED: ${APP_LOG_SYSLOG_ENABLED:-false}
      APP_LOG_SYSLOG_ADDRESS: ${APP_LOG_SYSLOG_ADDRESS:-localhost:514}
      APP_LOG_SYSLOG_PROTOCOL: ${APP_LOG_SYSLOG_PROTOCOL:-udp}
      APP_LOG_SYSLOG_FACILITY: ${APP_LOG_SYSLOG_FACILITY:-LOG_USER}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-true}
      CROSS_SITE_AUTH: ${CROSS_SITE_AUTH:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-true}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_CLOUD_BASE_URL: ${OLLAMA_CLOUD_BASE_URL:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_CLI_HTTP_1: ${CURSOR_CLI_HTTP_1:-1}
      CURSOR_CLI_EXTRA_ENV: ${CURSOR_CLI_EXTRA_ENV:-}
      AI_CLI_SUBSCRIPTIONS_ENABLED: ${AI_CLI_SUBSCRIPTIONS_ENABLED:-false}
      AI_CLI_RUNNER_MANAGER_URL: ${AI_CLI_RUNNER_MANAGER_URL:-http://ai-cli-runner-manager:9000}
      AI_CLI_RUNNER_MANAGER_TOKEN: ${AI_CLI_RUNNER_MANAGER_TOKEN:-}
      AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS: ${AI_CLI_INTERACTIVE_CAPACITY_WAIT_SECONDS:-30}
      AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS: ${AI_CLI_UNATTENDED_CAPACITY_WAIT_SECONDS:-300}
      AI_CLI_AUTH_IN_PROCESS: "false"
      WEBTERM_OTEL_REQUIRED: ${WEBTERM_OTEL_REQUIRED:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-webterm-backend}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
      WEBTERM_ENVIRONMENT: ${WEBTERM_ENVIRONMENT:-production}
      WEBTERM_PROCESS_ROLE: web
      CLI_RUNTIME_TIMEOUT_SECONDS: ${CLI_RUNTIME_TIMEOUT_SECONDS:-600}
      CLI_FIRST_OUTPUT_TIMEOUT_SECONDS: ${CLI_FIRST_OUTPUT_TIMEOUT_SECONDS:-120}
      DOMAIN_AUTH_ENABLED: ${DOMAIN_AUTH_ENABLED:-false}
      DOMAIN_AUTH_HEADER: ${DOMAIN_AUTH_HEADER:-REMOTE_USER}
      DOMAIN_AUTH_HEADER_ALIASES: ${DOMAIN_AUTH_HEADER_ALIASES:-}
      DOMAIN_AUTH_AUTO_CREATE: ${DOMAIN_AUTH_AUTO_CREATE:-true}
      DOMAIN_AUTH_LOWERCASE_USERNAMES: ${DOMAIN_AUTH_LOWERCASE_USERNAMES:-true}
      DOMAIN_AUTH_DEFAULT_PROFILE: ${DOMAIN_AUTH_DEFAULT_PROFILE:-pilot_user}
      DOMAIN_AUTH_TRUSTED_PROXIES: ${DOMAIN_AUTH_TRUSTED_PROXIES:-}
      DOMAIN_AUTH_SHARED_SECRET: ${DOMAIN_AUTH_SHARED_SECRET:-}
      DOMAIN_AUTH_SHARED_SECRET_HEADER: ${DOMAIN_AUTH_SHARED_SECRET_HEADER:-X-Domain-Auth-Secret}
      LOCAL_ADMIN_USERNAMES: ${LOCAL_ADMIN_USERNAMES:-admin}
      LDAP_PASSWORD_LOGIN_ENFORCED: ${LDAP_PASSWORD_LOGIN_ENFORCED:-true}
      LDAP_ENABLED: ${LDAP_ENABLED:-false}
      LDAP_SERVERS: ${LDAP_SERVERS:-}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_PORT: ${LDAP_PORT:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_FILTER: ${LDAP_FILTER:-(objectClass=user)}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-sAMAccountName}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
      LDAP_FULL_NAME_ATTRIBUTE: ${LDAP_FULL_NAME_ATTRIBUTE:-cn}
      LDAP_START_TLS: ${LDAP_START_TLS:-false}
      LDAP_IGNORE_CERT: ${LDAP_IGNORE_CERT:-false}
      LDAP_CA_CERT_FILE: ${LDAP_CA_CERT_FILE:-}
      LDAP_CA_CERT_DIR: ${LDAP_CA_CERT_DIR:-}
      LDAP_NETWORK_TIMEOUT_SECONDS: ${LDAP_NETWORK_TIMEOUT_SECONDS:-3}
      LDAP_DEFAULT_PROFILE: ${LDAP_DEFAULT_PROFILE:-server_only}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      PIPELINE_NOTIFY_EMAIL: ${PIPELINE_NOTIFY_EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_POLL_TOKEN: ""
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # MCP Runner: when set, stdio MCP servers run isolated in the runner (not on
      # this host) and become available to non-admins. Set STUDIO_MCP_RUNNER_TOKEN
      # to a strong shared secret so only the backend can reach the runner.
      STUDIO_MCP_RUNNER_URL: ${STUDIO_MCP_RUNNER_URL:-http://mcp-runner:9000}
      STUDIO_MCP_RUNNER_TOKEN: "${STUDIO_MCP_RUNNER_TOKEN:?STUDIO_MCP_RUNNER_TOKEN is required}"
      # Production HTTP processes have no Docker socket. Agent commands use a
      # separate filtered API which permits only the pinned hardened runner.
      DOCKER_HOST: tcp://agent-command-docker-proxy:2375
      AGENT_COMMAND_RUNTIME: docker
      AGENT_COMMAND_RUNNER_IMAGE: "${AGENT_COMMAND_RUNNER_IMAGE:?AGENT_COMMAND_RUNNER_IMAGE is required}"
      AGENT_COMMAND_DOCKER_NETWORK: ${AGENT_COMMAND_DOCKER_NETWORK:-bridge}
      AGENT_COMMAND_DOCKER_CPUS: ${AGENT_COMMAND_DOCKER_CPUS:-0.5}
      AGENT_COMMAND_DOCKER_MEMORY: ${AGENT_COMMAND_DOCKER_MEMORY:-256m}
      AGENT_COMMAND_DOCKER_PIDS_LIMIT: ${AGENT_COMMAND_DOCKER_PIDS_LIMIT:-64}
      AGENT_COMMAND_TIMEOUT_SECONDS: ${AGENT_COMMAND_TIMEOUT_SECONDS:-120}
      AGENT_COMMAND_OUTPUT_MAX_CHARS: ${AGENT_COMMAND_OUTPUT_MAX_CHARS:-100000}
      PLUGIN_BACKEND_DOCKER_HOST: tcp://plugin-backend-docker-proxy:2375
      PLUGIN_BACKEND_RUNNER_IMAGE: ${PLUGIN_BACKEND_RUNNER_IMAGE:-}
      PLUGIN_BACKEND_DOCKER_EGRESS_NETWORK: ${PLUGIN_BACKEND_DOCKER_EGRESS_NETWORK:-}
      PLUGIN_BACKEND_DOCKER_CPUS: ${PLUGIN_BACKEND_DOCKER_CPUS:-0.5}
      PLUGIN_BACKEND_DOCKER_MEMORY: ${PLUGIN_BACKEND_DOCKER_MEMORY:-128m}
      PLUGIN_BACKEND_DOCKER_PIDS_LIMIT: ${PLUGIN_BACKEND_DOCKER_PIDS_LIMIT:-32}
      WEBTERM_ANSIBLE_IMAGE: ${WEBTERM_ANSIBLE_IMAGE:-webterm-ansible:latest}
      WEBTERM_ANSIBLE_REQUIRE_ISOLATED: "true"
      WEBTERM_ANSIBLE_VALIDATOR_SOCKET: /run/playbook-validator/validator.sock
      PLAYBOOK_BUNDLE_STORAGE_ROOT: /workspace/private/playbook_bundles
    expose:
      - "9000"
    volumes:
      - mini_prod_media:/workspace/media
      - playbook_bundles:/workspace/private/playbook_bundles
      - mini_prod_staticfiles:/workspace/staticfiles
      - mini_prod_config:/workspace/config_runtime
      - mini_prod_logs:/workspace/logs
      - ./docker/ldap:/etc/webtrerm/ldap:ro
      - playbook_validator_socket:/run/playbook-validator
    networks:
      - default
      - docker-control
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-runner:
        condition: service_healthy
      playbook-validator:
        condition: service_healthy
      agent-command-docker-proxy:
        condition: service_healthy
      plugin-backend-docker-proxy:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: ${WEBTERM_BACKEND_MEMORY:-1g}
    cpus: ${WEBTERM_BACKEND_CPUS:-2.0}
    pids_limit: ${WEBTERM_BACKEND_PIDS_LIMIT:-512}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://127.0.0.1:9000/api/ready/?scope=core', headers={'X-Forwarded-Proto': 'https', 'Host': '127.0.0.1'}); urllib.request.urlopen(req, timeout=4).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *json-logging

  migrate:
    <<: *backend-worker
    command:
      [
        "sh",
        "-lc",
        "python manage.py migrate --noinput && python manage.py migrate_ssh_private_keys --apply && python manage.py load_pipeline_templates && cp -a /workspace/staticfiles/. /static-target/",
      ]
    volumes:
      - mini_prod_media:/workspace/media
      - mini_prod_staticfiles:/static-target
      - mini_prod_config:/workspace/config_runtime
      - mini_prod_logs:/workspace/logs
      - ./docker/ldap:/etc/webtrerm/ldap:ro
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

