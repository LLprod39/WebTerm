<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTerm</title>
    <meta name="application-name" content="WebTerm" />
    <meta name="description" content="Server management console with terminal access and AI assistance." />
    <meta name="author" content="WebTerm contributors" />
    <meta name="theme-color" content="#101013" />
    <!-- Help static demo deploys avoid stale index.html / chunk mismatches -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="demo-build" content="2026-07-09-servers-modal-v4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          // Last style applied for this browser session/user (FOUC guard).
          // Per-user map is applied after auth loads in the app.
          var style = localStorage.getItem("webterm.ui-style.active");
          var allowed = { "enterprise-light": 1, "enterprise-dark": 1, catalog: 1, classic: 1, pulse: 1, signal: 1, folio: 1, "folio-dark": 1, flow: 1, "flow-dark": 1, ashita: 1 };
          if (style === "nocturne" || style === "haze") style = "flow-dark";
          if (!allowed[style]) {
            style = localStorage.getItem("webterm.ui-style");
          }
          if (!allowed[style]) style = "flow-dark";
          var appPath = window.location.pathname;
          var basePath = "%BASE_URL%";
          if (!basePath || basePath.charAt(0) === "%") basePath = "/";
          var normalizedBase = basePath.replace(/\/+$/, "");
          if (
            normalizedBase &&
            normalizedBase !== "/" &&
            (appPath === normalizedBase || appPath.indexOf(normalizedBase + "/") === 0)
          ) {
            appPath = appPath.slice(normalizedBase.length) || "/";
          }
          var isEnterpriseStyle = style === "enterprise-light" || style === "enterprise-dark";
          var effectiveStyle = isEnterpriseStyle && /^\/chat(?:\/|$)/.test(appPath)
            ? "flow-dark"
            : style;
          document.documentElement.setAttribute("data-ui-preference", style);
          document.documentElement.setAttribute("data-ui-style", effectiveStyle);
          document.documentElement.style.colorScheme = effectiveStyle === "enterprise-light" || effectiveStyle === "folio" || effectiveStyle === "flow"
            ? "light"
            : "dark";
          var themeColor = effectiveStyle === "enterprise-light"
            ? "#f3f6f8"
            : effectiveStyle === "enterprise-dark"
              ? "#0b1118"
              : "#101013";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", themeColor);
          if (effectiveStyle !== "enterprise-light" && effectiveStyle !== "enterprise-dark") {
            var fontLink = document.createElement("link");
            fontLink.id = "webterm-supported-theme-fonts";
            fontLink.rel = "stylesheet";
            fontLink.href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap";
            document.head.appendChild(fontLink);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-ui-style", "flow-dark");
        }

        // Stale GH Pages/service-worker caches often keep old index + missing chunks.
        // One automatic hard reload when a script/style 404s after a new deploy.
        var buildMeta = document.querySelector('meta[name="demo-build"]');
        var buildId = (buildMeta && buildMeta.getAttribute("content")) || "unknown";
        var reloadKey = "webterm.demo.chunk-reload." + buildId;
        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (!target || (target.tagName !== "SCRIPT" && target.tagName !== "LINK")) return;
            try {
              if (sessionStorage.getItem(reloadKey)) return;
              sessionStorage.setItem(reloadKey, "1");
              var url = new URL(window.location.href);
              url.searchParams.set("_cb", String(Date.now()));
              window.location.replace(url.toString());
            } catch (err) {
              // ignore
            }
          },
          true
        );
      })();
    </script>

    <meta property="og:title" content="WebTerm" />
    <meta property="og:description" content="Server management console with terminal access and AI assistance." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WebTerm" />
    <meta name="twitter:description" content="Server management console with terminal access and AI assistance." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
